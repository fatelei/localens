name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover
        required: true
        type: string
      source_run_id:
        description: Completed Release run with all five package jobs successful
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ github.ref_name }}
      full_release: true

  publish:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate recovery source
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/publish_release.py --tag "$RELEASE_TAG" --check-source-run "$SOURCE_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Verify and publish complete release assets
        run: |
          source_args=()
          if [[ -n "$SOURCE_RUN" ]]; then source_args+=(--source-run "$SOURCE_RUN"); fi
          python3 scripts/publish_release.py --tag "$RELEASE_TAG" "${source_args[@]}"
