name: Lint, test and native packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      full_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Formatting and source syntax
        run: python scripts/ci.py lint
      - name: Workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=

  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2025
            cgo: '0'
          - os: windows
            arch: arm64
            runner: windows-11-arm
            cgo: '0'
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            cgo: '1'
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cgo: '1'
          - os: macos
            arch: arm64
            runner: macos-15
            cgo: '1'
    env:
      CI_TARGET_ARCH: ${{ matrix.arch }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: ${{ matrix.cgo }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Linux desktop and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xvfb xauth
      - name: Vet, tests and frontend regressions
        run: python scripts/ci.py test
      - name: Native production build
        run: python scripts/ci.py build
      - name: Prepare offline Python, dependencies and pinned model
        if: inputs.full_release
        run: python scripts/runtime_bundle.py
      - name: Package and verify architecture
        run: python scripts/package_release.py --version "$env:RELEASE_VERSION" --arch "$env:CI_TARGET_ARCH"
        shell: pwsh
        if: inputs.full_release && runner.os == 'Windows'
      - name: Package and verify architecture
        run: python scripts/package_release.py --version "$RELEASE_VERSION" --arch "$CI_TARGET_ARCH"
        if: inputs.full_release && runner.os != 'Windows'
      - if: inputs.full_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
