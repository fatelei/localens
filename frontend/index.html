<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>拾物搜索</title><link rel="stylesheet" href="style.css"></head><body>
<div id="launcher" class="launcher">
 <div class="search-bar"><span class="drag-handle" data-i18n-title="drag" title="拖动窗口" role="img" data-i18n-aria="drag" aria-label="拖动搜索窗口"><svg class="search-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><input id="query" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search" placeholder="搜索本地文件…" data-i18n-aria="search" aria-label="搜索本地文件" autofocus><span id="search-spinner" class="spinner" hidden><svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/></svg></span><button id="settings-open" class="icon-button" data-i18n-aria="settings" aria-label="设置" data-i18n-title="settings" title="设置 · ⌘ ,"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 3 3-2v-3l3-2-1-3-3-1-1-3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button></div>
 <section id="search-panel" hidden><div class="filters" role="group" data-i18n-aria="fileTypes" aria-label="文件类型"><button data-i18n="all" data-kind="all" class="selected">全部</button><button data-i18n="document" data-kind="document">文档</button><button data-i18n="image" data-kind="image">图片</button><button data-i18n="video" data-kind="video">视频</button><button data-i18n="audio" data-kind="audio">音频</button><button data-i18n="other" data-kind="other">其他</button><span id="search-mode"></span><button id="related-toggle" hidden aria-expanded="false">相关内容</button></div><div id="results" role="listbox" data-i18n-aria="searchResults" aria-label="搜索结果"></div><div id="empty" class="empty" hidden><p id="empty-message"></p><button id="empty-add" class="text-button" hidden data-i18n="addFolderLink">添加索引文件夹 ↗</button></div><div id="preview" class="preview" hidden><div id="preview-visual"></div><div class="preview-detail"><strong id="preview-name"></strong><p id="preview-path"></p><button id="preview-open" class="text-button" data-i18n="previewOpen">打开 ↗</button><button id="preview-reveal" class="text-button" data-i18n="reveal">在文件夹中显示</button></div></div><footer><span id="results-summary"></span><span data-i18n="keys"></span></footer></section>
</div>
<section id="settings" class="settings" hidden>
 <header><button id="settings-close" class="icon-button" data-i18n-aria="back" aria-label="返回搜索">←</button><h1 data-i18n="title">拾物设置</h1><button id="quit" class="text-button" data-i18n="quit">退出</button></header>
 <div class="settings-body"><div class="language-row"><label for="language" data-i18n="language">界面语言</label><select id="language" aria-label="Interface language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></div><div class="language-row"><label for="editor" data-i18n="editor">代码编辑器</label><select id="editor"><option value="" data-i18n="systemDefault">系统默认应用</option></select></div><p class="hint" data-i18n="editorHint"></p><div class="settings-section-heading"><h2 data-i18n="folders">索引文件夹</h2><button id="add-root" class="small-button" data-i18n="addFolder">＋ 添加文件夹</button></div><p class="hint" data-i18n="foldersHint"></p><div id="roots"></div><div class="index-status"><span id="index-status"></span><button id="rescan" class="text-button" data-i18n="rescan">更新索引</button><button id="cancel-scan" class="text-button" hidden data-i18n="pauseScan">暂停扫描</button></div><p id="index-error" class="error" hidden></p>
 <div class="settings-section-heading model-section"><h2 data-i18n="contentIndex">内容索引</h2></div><p id="content-status" class="hint"></p><div class="settings-section-heading model-section"><h2 data-i18n="imageOCR">图片文字识别</h2><span id="ocr-platform" class="hint" data-i18n="ocrPlatform" hidden>仅 macOS 支持</span><label class="switch"><input id="ocr" type="checkbox" aria-describedby="ocr-status"><span data-i18n="enabled">开启</span></label></div><p id="ocr-hint" class="hint" data-i18n="ocrHint"></p><p id="ocr-status" class="hint"></p><button id="retry-ocr" class="text-button" data-i18n="retryOCR">重新识别图片文字</button><div class="settings-section-heading model-section"><h2 data-i18n="semantic">语义搜索</h2><label class="switch"><input id="semantic" type="checkbox"><span data-i18n="enabled">搜索时使用</span></label></div><div class="model-line"><span id="model-dot" class="status-dot"></span><strong id="model-label">未启用</strong><span id="vector-count"></span></div><p id="model-hint" class="hint" data-i18n="modelHint"></p><div class="model-actions"><button id="start-model" class="small-button" data-i18n="loadModel">加载模型</button><button id="stop-model" class="text-button" data-i18n="stopModel">暂停模型</button><button id="retry-vectors" class="text-button" data-i18n="retryVectors">补充内容索引</button></div><pre id="model-error" class="error" hidden></pre>
 <div class="shortcut-note"><span data-i18n="shortcut">随时唤起搜索</span><kbd id="shortcut">Ctrl + Q</kbd></div><div class="shortcut-editor"><input id="shortcut-input" readonly data-i18n-aria="shortcut" data-i18n-placeholder="shortcutCapture" placeholder="点击修改后按下组合键"><button id="shortcut-edit" class="small-button" data-i18n="shortcutEdit">修改</button><button id="shortcut-save" class="small-button" disabled data-i18n="shortcutSave">保存</button><button id="shortcut-reset" class="text-button" data-i18n="shortcutReset">恢复默认</button></div><p class="hint" data-i18n="shortcutHint"></p><p id="shortcut-error" class="error" hidden></p></div>
</section><div id="toast" role="status" hidden></div><script src="/wails/runtime.js"></script><script src="i18n.js"></script><script src="icons.js"></script><script src="evidence.js"></script><script src="thumbnails.js"></script><script src="app.js"></script></body></html>
